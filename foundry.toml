[profile.default]
src = "src"
test = "test"
# Echidna's and Medusa's tester (test/fuzz/) holds the invariants it inherits: forge runs the originals
no_match_path = "test/fuzz/*"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20000
via_ir = true
# the IMD launch gate rebuilds every contract and refuses a launch unless bytecode_hash is "none" (reproducible)
bytecode_hash = "none"
cbor_metadata = false
ffi = false
gas_limit = "18446744073709551615"
memory_limit = 1073741824
fs_permissions = [{ access = "read", path = "./test/data" }, { access = "read", path = "./launch" }]
# ChessEngineV5 is over Ethereum's 24,576-byte limit at 20,000 runs; at 200 it is ~22.2 KB for ~6% more gas per
# choice, with the same moves (ROADMAP 2026-10-21)
additional_compiler_profiles = [{ name = "small", optimizer_runs = 200 }]
compilation_restrictions = [{ paths = "src/ChessEngineV5.sol", max_optimizer_runs = 200 }]
remappings = [
  "v4-core/=lib/v4-core/",
  "@uniswap/v4-core/=lib/v4-core/",
  "forge-std/=lib/v4-core/lib/forge-std/src/",
  "solmate/=lib/v4-core/lib/solmate/",
  "@openzeppelin/=lib/v4-core/lib/openzeppelin-contracts/",
  "openzeppelin-contracts/=lib/v4-core/lib/openzeppelin-contracts/",
]
